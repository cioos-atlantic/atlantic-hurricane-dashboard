[ERDDAP]
server = https://coastwatch.pfeg.noaa.gov/erddap
dataset = cwwcNDBCMet
standard_names= wind_speed
                wind_speed_of_gust
                wind_from_direction
                air_temperature
                air_pressure
                relative_humidity
                sea_surface_temperature
                sea_surface_wave_significant_height
                sea_surface_wave_maximum_height
                #sea_surface_wave_maximum_period
                #sea_surface_wave_from_direction
                #sea_surface_wave_mean_period
                #sea_surface_wave_zero_upcrossing_period
ignore_stations = 
time_buffer = 0
max_lat = 90
min_lat = 0
max_lon = 0
min_lon = -105

# Cache table data types, derived from postgres table structure
[cache_table_dtypes]
storm = string
station = string
min_time = datetime
max_time = datetime
min_lon = float
max_lon = float
min_lat = float
max_lat = float

[erddap_cache]
active_data_period = 14
post_storm_period = 2
# Active storm monitoring period in days
# Number of days post storm to still collect data from (historical)